name: Build Nurse Robot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nurse_robot_project

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files & Disable Lint
        run: |
          mkdir -p assets/images
          flutter create . --platforms=android --project-name=nurse_robot_app
          echo "android.lintOptions.checkReleaseBuilds=false" >> android/gradle.properties
          echo "android.lintOptions.abortOnError=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nurse-robot-app-release
          path: nurse_robot_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
